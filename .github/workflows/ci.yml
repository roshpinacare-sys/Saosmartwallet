# wallet-core-tests — added additively by agent-9 (task 4-c).
# First CI lane for packages/core crypto unit tests (KDF / Shamir / cipher).
# wave 19.77: the chains registry lane joins (BLURT entry + unified vault
# key-route proof) — same additive discipline, nothing replaced.
name: wallet-core-tests

on:
  push:
  pull_request:

jobs:
  core-crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run packages/core crypto tests
        run: bun test packages/core/test/

      - name: Run packages/chains registry tests (BLURT + vault key-route)
        run: bun test packages/chains/test/

      # t56 convergence: the multichain signing surface + BLURT adapter lanes
      # join additively (agent-9, PR feat/saosmartwallet-signing-engine) —
      # nothing replaced, two new directories only.
      - name: Run packages/crypto multichain signer tests
        run: bun test packages/crypto/test/

      - name: Run packages/chains/blurt adapter tests
        run: bun test packages/chains/blurt/test/

      # t58 wallet-htlc-swap-engine (agent-9, MASTER DIRECTIVE §3): the atomic
      # swap / HTLC primitives join additively — one new directory only,
      # nothing replaced.
      - name: Run packages/swap HTLC + witness + session tests
        run: bun test packages/swap/test/

      # agent-9 (t58): the packages/htlc machine lane (cycle-31) had no CI
      # lane — added additively so the whole repo's HTLC surface is provably
      # green on every push.
      - name: Run packages/htlc machine + codec tests
        run: bun test packages/htlc/test/

      # wave 20.01 (agent-9, ULTIMATE SWARM DIRECTIVE §4): the FixedFloat
      # exchange rail joins additively — one new directory only, nothing
      # replaced. Zero-network suite (RFC 4231-pinned signing, injected
      # transport, fail-closed custody laws).
      - name: Run packages/fixedfloat rail tests
        run: bun test packages/fixedfloat/test/

      # wave 20.1 (G77-d, owner MASTER DIRECTIVE §3.1): the production HSM
      # signing runtime joins additively — one new directory only, nothing
      # replaced. Zero-network suite: self-generated fixture keys ONLY,
      # SIGN-ONLY (no broadcast route exists), deny-by-default auth matrix,
      # honest verdicts, receipts with wire digests.
      - name: Run packages/hsm-runtime signing runtime tests
        run: bun test packages/hsm-runtime/test/

      # wave G78-d (owner directive §1.3, worker 4/9): the cross-chain arb
      # scanner joins additively — one new directory only, nothing replaced.
      # Zero-network suite (injected transports, measured wire fixtures,
      # anti-mock provenance laws on every row).
      - name: Run packages/arb-scanner corridor tests
        run: bun test packages/arb-scanner/test/

      # wave G78-d: the lawful arb execution rail joins additively — one new
      # directory only, nothing replaced. Zero-network suite: fixture keys
      # ONLY, SIGN-ONLY rail (no broadcast path — grep-law pinned), armed
      # policy fail-closed matrix, authority/RC/reserve/cap verdict laws.
      - name: Run packages/arb-executor rail tests
        run: bun test packages/arb-executor/test/
