# wallet-core-tests — added additively by agent-9 (task 4-c).
# First CI lane for packages/core crypto unit tests (KDF / Shamir / cipher).
# wave 19.77: the chains registry lane joins (BLURT entry + unified vault
# key-route proof) — same additive discipline, nothing replaced.
name: wallet-core-tests

on:
  push:
  pull_request:

jobs:
  core-crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run packages/core crypto tests
        run: bun test packages/core/test/

      - name: Run packages/chains registry tests (BLURT + vault key-route)
        run: bun test packages/chains/test/

      # t56 convergence: the multichain signing surface + BLURT adapter lanes
      # join additively (agent-9, PR feat/saosmartwallet-signing-engine) —
      # nothing replaced, two new directories only.
      - name: Run packages/crypto multichain signer tests
        run: bun test packages/crypto/test/

      - name: Run packages/chains/blurt adapter tests
        run: bun test packages/chains/blurt/test/

      # t58 wallet-htlc-swap-engine (agent-9, MASTER DIRECTIVE §3): the atomic
      # swap / HTLC primitives join additively — one new directory only,
      # nothing replaced.
      - name: Run packages/swap HTLC + witness + session tests
        run: bun test packages/swap/test/

      # agent-9 (t58): the packages/htlc machine lane (cycle-31) had no CI
      # lane — added additively so the whole repo's HTLC surface is provably
      # green on every push.
      - name: Run packages/htlc machine + codec tests
        run: bun test packages/htlc/test/
